<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المزاج للحماية</title>
<style>
  html, body, div, h1, h2, h3, p, li, span, a, button {

    background: #0a0a0a;
    font-family: Tahoma, sans-serif;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .card {
    background: #1e293b;
    border: 2px solid #ec4899;
    border-radius: 20px;
    padding: 20px;
    max-width: 500px;
    width: 100%;
  }
  .card li {
    background: rgba(255,255,255,0.05);
    margin: 8px 0;
    padding: 10px;
    border-radius: 10px;
    list-style: none;
    color: white !important;
  }
  .phone {
    color: #00ff88 !important;
    font-weight: bold;
    text-align: center;
    display: block;
    margin: 15px 0;
    font-size: 19px;
  }
  .btn {
    background: linear-gradient(90deg, #ec4899, #8b5cf6);
    color: white !important;
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    font-size: 20px;
    font-weight: bold;
  }
</style>
</head>
<body>

</body>
</html>
